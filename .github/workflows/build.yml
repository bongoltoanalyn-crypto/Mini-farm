name: Build Mini Farm APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o My_Mini_Farm_Mythical_Philippines_APK_Build.zip || true
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install -g @capacitor/cli
      - run: npx cap init "Mini Farm" com.bossing.minifarm --web-dir=. --npm-client=npm || true
      - run: npx cap add android || true
      - run: npx cap copy || true
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Farm-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
